name: ChangeGuard CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-validation:
    name: Python Backend & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('project/requirements.txt', 'requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies and verify compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=24,<27"
          python -m pip install "pytest>=8,<10" "ruff>=0.8,<1" "PyYAML>=6,<7"

          if [ -f "project/requirements.txt" ]; then
            if [ -s "project/requirements.txt" ]; then
              echo "Installing dependencies from project/requirements.txt"
              python -m pip install -r project/requirements.txt
            else
              echo "::notice file=project/requirements.txt::project/requirements.txt is currently empty."
            fi
          else
            malformed=$(find project -maxdepth 1 -name 'requirements.txt*' 2>/dev/null || true)
            if [ -n "$malformed" ]; then
              echo "::warning::Standard project/requirements.txt not found. Detected malformed filename: ${malformed}. Rename it to project/requirements.txt in a dedicated fix."
            else
              echo "::warning::project/requirements.txt not found; skipping application dependency installation."
            fi
          fi

          if [ -f "requirements.txt" ] && [ -s "requirements.txt" ]; then
            echo "Installing dependencies from root requirements.txt"
            python -m pip install -r requirements.txt
          fi

          python -m pip check

      - name: Validate Python syntax across repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib
          import sys

          excluded_dirs = {
              ".git",
              ".venv",
              "venv",
              "env",
              "node_modules",
              "__pycache__",
              ".pytest_cache",
              ".ruff_cache",
              "build",
              "dist",
          }
          excluded_subpaths = {
              pathlib.Path("tests/fixtures/invalid"),
          }

          root = pathlib.Path(".")
          checked = 0
          errors = []

          for path in sorted(root.rglob("*.py")):
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if any(path.is_relative_to(sub) for sub in excluded_subpaths):
                  continue
              checked += 1
              try:
                  source = path.read_text(encoding="utf-8")
                  ast.parse(source, filename=str(path))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          print(f"Validated syntax for {checked} Python file(s).")
          if errors:
              for err in errors:
                  print(f"::error::{err}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Run Ruff critical correctness checks
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            --select E9,F63,F7,F82,F811,F404,F406,F407,F601,F602 \
            --exclude .git,.venv,venv,env,node_modules,__pycache__,.pytest_cache,build,dist,tests/fixtures/invalid \
            .

      - name: Run automated pytest suite
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -v --tb=short

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      frontend_status: ${{ steps.detect.outputs.frontend_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect frontend implementation
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "frontend/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
            echo "frontend_status=validated" >> "$GITHUB_OUTPUT"
            if [ -f "frontend/pnpm-lock.yaml" ]; then
              echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            elif [ -f "frontend/yarn.lock" ]; then
              echo "pm=yarn" >> "$GITHUB_OUTPUT"
            elif [ -f "frontend/package-lock.json" ]; then
              echo "pm=npm-ci" >> "$GITHUB_OUTPUT"
            else
              echo "pm=npm-install" >> "$GITHUB_OUTPUT"
              echo "::warning::frontend/package.json exists without a lockfile; falling back to npm install."
            fi
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            echo "frontend_status=not_applicable" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend not yet implemented (frontend/package.json not found); frontend validation is not applicable."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.has_frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: steps.detect.outputs.has_frontend == 'true'
        working-directory: frontend
        shell: bash
        env:
          PM: ${{ steps.detect.outputs.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
            npm-ci)
              npm ci
              ;;
            npm-install)
              npm install
              ;;
            *)
              echo "Unknown package manager mode: $PM" >&2
              exit 1
              ;;
          esac

      - name: Run available frontend lint, typecheck, test, and build scripts
        if: steps.detect.outputs.has_frontend == 'true'
        working-directory: frontend
        shell: bash
        env:
          PM: ${{ steps.detect.outputs.pm }}
        run: |
          set -euo pipefail
          run_script() {
            local script_name="$1"
            if node -e "const p = require('./package.json'); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)" "$script_name"; then
              echo "Running frontend script: $script_name"
              case "$PM" in
                pnpm) pnpm run "$script_name" ;;
                yarn) yarn run "$script_name" ;;
                *) npm run "$script_name" ;;
              esac
            else
              echo "Script '$script_name' not defined in frontend/package.json; skipping."
            fi
          }

          run_script "lint"
          run_script "typecheck"
          run_script "type-check"
          run_script "test"
          run_script "build"

  security-scan:
    name: Secret & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Scan repository for committed secrets and .env files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          excluded_dirs = {
              ".git",
              ".venv",
              "venv",
              "env",
              "node_modules",
              "__pycache__",
              ".pytest_cache",
              "build",
              "dist",
          }
          binary_extensions = {
              ".docx",
              ".pdf",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".ico",
              ".zip",
              ".gz",
              ".whl",
              ".pyc",
              ".sqlite",
              ".db",
          }
          allowed_env_names = {
              ".env.example",
              ".env.sample",
              ".env.template",
          }

          patterns = [
              ("AWS Access Key ID", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("GitHub Personal Access Token", re.compile(r"\bgh[pousr]_[A-Za-z0-9]{36}\b")),
              ("GitHub Fine-Grained PAT", re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b")),
              ("OpenAI API Key", re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{24,}\b")),
              ("Anthropic API Key", re.compile(r"\bsk-ant-[A-Za-z0-9_-]{20,}\b")),
              ("Google API Key", re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b")),
              (
                  "Private Key Block",
                  re.compile(r"-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"),
              ),
          ]

          root = pathlib.Path(".")
          findings = []
          scanned_files = 0

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if path.name == ".env" or (
                  path.name.startswith(".env.") and path.name not in allowed_env_names
              ):
                  findings.append(f"{path}:1 [Committed .env file]")
                  continue
              if path.suffix.lower() in binary_extensions:
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              scanned_files += 1
              for lineno, line in enumerate(content.splitlines(), start=1):
                  for rule_name, regex in patterns:
                      if regex.search(line):
                          findings.append(f"{path}:{lineno} [{rule_name}]")

          print(f"Scanned {scanned_files} text file(s) for secrets and .env files.")
          if findings:
              for finding in findings:
                  print(f"::error::Potential secret detected at {finding}", file=sys.stderr)
              sys.exit(1)
          PY

  branch-policy:
    name: Release Branch Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate release branch flow for PRs targeting main
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              develop|release/*|hotfix/*)
                echo "Allowed release source branch '$HEAD_REF' targeting 'main'."
                ;;
              *)
                echo "::error::Pull requests targeting 'main' must originate from 'develop', 'release/*', or 'hotfix/*'. Current head branch: '$HEAD_REF'. Please target 'develop' first." >&2
                exit 1
                ;;
            esac
          else
            echo "Release branch policy check not triggered (event='$EVENT_NAME', base='$BASE_REF')."
          fi

  ci-quality-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    needs:
      - python-validation
      - frontend-validation
      - security-scan
      - branch-policy
    steps:
      - name: Evaluate mandatory job results
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          FRONTEND_STATUS: ${{ needs.frontend-validation.outputs.frontend_status }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
        run: |
          set -euo pipefail

          {
            echo "## ChangeGuard CI Quality Gate Summary"
            echo ""
            echo "| Check | Result | Notes |"
            echo "| --- | --- | --- |"
            echo "| Python Backend & Tests | \`$PYTHON_RESULT\` | Syntax, Ruff critical lint, pip check, pytest |"
            echo "| Frontend Validation | \`$FRONTEND_RESULT\` | Status: \`${FRONTEND_STATUS:-unknown}\` |"
            echo "| Secret & Security Scan | \`$SECURITY_RESULT\` | Committed .env and secret pattern scan |"
            echo "| Release Branch Policy | \`$BRANCH_POLICY_RESULT\` | Enforces develop/release/hotfix -> main |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for pair in \
            "python-validation:$PYTHON_RESULT" \
            "frontend-validation:$FRONTEND_RESULT" \
            "security-scan:$SECURITY_RESULT" \
            "branch-policy:$BRANCH_POLICY_RESULT"; do
            job_name="${pair%%:*}"
            job_result="${pair#*:}"
            if [ "$job_result" != "success" ]; then
              echo "::error::Mandatory job '$job_name' did not succeed (result='$job_result')." >&2
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "CI Quality Gate FAILED." >&2
            exit 1
          fi

          echo "CI Quality Gate PASSED."
